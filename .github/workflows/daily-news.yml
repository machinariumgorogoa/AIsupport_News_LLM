name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK_1: ${{ secrets.FEISHU_NEWS_LLM }}
          FEISHU_WEBHOOK_2: ${{ secrets.FEISHU_NEWS_LLM_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          pip install requests
          python << 'EOF'
          import os
          import requests
          import json
          import re
          from datetime import datetime, timedelta

          FEISHU_WEBHOOK_1 = os.environ['FEISHU_WEBHOOK_1']
          FEISHU_WEBHOOK_2 = os.environ['FEISHU_WEBHOOK_2']
          SERVERCHAN_KEY = os.environ['SERVERCHAN_KEY']
          TAVILY_API_KEY = os.environ['TAVILY_API_KEY']
          KIMI_API_KEY = os.environ['KIMI_API_KEY']

          date_str = (datetime.now() + timedelta(hours=8)).strftime('%Y-%m-%d')
          LOW_QUALITY_DOMAINS = ['instagram.com', 'facebook.com', 'linkedin.com', 'workable.com', 'threads.com']
          
          def is_chinese(text):
              return bool(re.search(r'[\u4e00-\u9fff]', text))

          def read_prompt_file(filename):
              try:
                  with open('prompts/' + filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                      print('  [OK] 读取 ' + filename + ': ' + str(len(content)) + ' 字符')
                      return content
              except Exception as e:
                  print('  [ERR] 读取 ' + filename + ' 失败: ' + str(e))
                  return None

          def call_kimi(prompt, max_tokens=1000):
              if not prompt or len(prompt.strip()) < 10:
                  print('    [WARN] prompt为空，跳过')
                  return None
              
              try:
                  response = requests.post(
                      'https://api.moonshot.cn/v1/chat/completions',
                      headers={'Authorization': 'Bearer ' + KIMI_API_KEY, 'Content-Type': 'application/json'},
                      json={'model': 'kimi-k2.5', 'messages': [{'role': 'user', 'content': prompt}], 'temperature': 1, 'max_tokens': max_tokens},
                      timeout=300
                  )
                  
                  print('    [API] 状态码: ' + str(response.status_code))
                  
                  if response.status_code != 200:
                      print('    [ERR] 错误响应: ' + response.text[:100])
                      return None
                  
                  result = response.json()
                  if 'choices' not in result:
                      print('    [ERR] 无choices字段')
                      return None
                  
                  return result['choices'][0]['message']['content'].strip()
              except Exception as e:
                  print('    [ERR] 调用异常: ' + str(e))
                  return None

          # Fallback提示词
          FALLBACK_DEDUP = '分析以下新闻，去除重复报道同一事件的条目，保留{target}条：\n{titles}\n返回序号，如1,3,5'
          FALLBACK_TRANSLATE = '翻译以下新闻成中文：\n标题：{title}\n摘要：{content}\n格式：\n标题：[中文]\n摘要：[中文]'
          FALLBACK_CLASSIFY = '分类以下新闻到融资、大模型、硬件三类：\n{titles}\n返回JSON格式'

          print('=== 搜索阶段 ===')
          resp1 = requests.post('https://api.tavily.com/search', 
              json={'api_key': TAVILY_API_KEY, 'query': '(funding OR IPO OR merger OR acquisition OR valuation) AND (AI OR artificial intelligence)', 'max_results': 20, 'time_range': 'day', 'search_depth': 'basic', 'exclude_domains': ['youtube.com', 'reddit.com', 'instagram.com', 'facebook.com']},
              timeout=150)
          results1 = resp1.json().get('results', [])
          print('融资类: ' + str(len(results1)) + ' 条')

          resp2 = requests.post('https://api.tavily.com/search',
              json={'api_key': TAVILY_API_KEY, 'query': '(hire OR appoint OR founder OR CEO OR launch OR product) AND (AI OR artificial intelligence)', 'max_results': 20, 'time_range': 'day', 'search_depth': 'basic', 'exclude_domains': ['youtube.com', 'reddit.com', 'instagram.com', 'facebook.com']},
              timeout=150)
          results2 = resp2.json().get('results', [])
          print('人事类: ' + str(len(results2)) + ' 条')

          seen_urls = set()
          raw_items = []
          for item in results1 + results2:
              url = item.get('url', '')
              if url in seen_urls or not url:
                  continue
              if any(d in url.lower() for d in LOW_QUALITY_DOMAINS):
                  continue
              seen_urls.add(url)
              content = item.get('content', '')
              raw_items.append({
                  'title': item.get('title', ''),
                  'link': url,
                  'snippet': content[:80] + '...' if len(content) > 80 else content,
                  'raw_snippet': content,
                  'is_chinese': is_chinese(item.get('title', ''))
              })

          print('过滤后: ' + str(len(raw_items)) + ' 条')

          print('=== 去重阶段 ===')
          dedup_template = read_prompt_file('dedup.txt') or FALLBACK_DEDUP
          titles_text = '\n'.join([str(i+1) + '. ' + item['title'] + '\n   摘要：' + item['raw_snippet'][:50] for i, item in enumerate(raw_items)])
          dedup_prompt = dedup_template.format(count=len(raw_items), titles=titles_text, target=10)
          
          dedup_result = call_kimi(dedup_prompt, max_tokens=20000)
          deduped_items = []
          if dedup_result:
              try:
                  numbers = re.findall(r'\d+', dedup_result)
                  indices = [int(n) - 1 for n in numbers if 1 <= int(n) <= len(raw_items)]
                  deduped_items = [raw_items[i] for i in indices[:10]]
                  print('去重成功: ' + str(len(deduped_items)) + ' 条')
              except Exception as e:
                  print('去重解析失败: ' + str(e))
          if not deduped_items:
              print('去重失败，使用top10')
              deduped_items = raw_items[:10]

          print('=== 翻译阶段 ===')
          trans_template = read_prompt_file('translate.txt') or FALLBACK_TRANSLATE
          translated_items = []
          for i, item in enumerate(deduped_items):
              if not item['is_chinese']:
                  print('  翻译 ' + str(i+1) + '/' + str(len(deduped_items)) + ': ' + item['title'][:30])
                  trans_prompt = trans_template.format(title=item['title'], content=item['raw_snippet'][:200])
                  trans_result = call_kimi(trans_prompt, max_tokens=800)
                  if trans_result:
                      lines = [l.strip() for l in trans_result.split('\n') if l.strip()]
                      if lines:
                          item['title'] = lines[0]
                      if len(lines) > 1:
                          item['snippet'] = lines[1]
              translated_items.append(item)
          print('翻译完成: ' + str(len(translated_items)) + ' 条')

          print('=== 分类阶段 ===')
          class_template = read_prompt_file('classify.txt') or FALLBACK_CLASSIFY
          class_titles = '\n'.join([str(i+1) + '. ' + item['title'] for i, item in enumerate(translated_items)])
          class_prompt = class_template.format(titles=class_titles)
          
          class_result = call_kimi(class_prompt, max_tokens=50000)
          categories = {'融资速报': [], '行业动态-大模型': [], '行业动态-AI硬件/具身智能': []}
          
          if class_result:
              try:
                  json_match = re.search(r'\{.*\}', class_result, re.DOTALL)
                  if json_match:
                      parsed = json.loads(json_match.group())
                      for cat, indices in parsed.items():
                          if cat in categories:
                              valid = [i-1 for i in indices if isinstance(i, int) and 1 <= i <= len(translated_items)]
                              categories[cat] = [translated_items[i] for i in valid]
                      print('分类成功')
              except Exception as e:
                  print('分类解析失败: ' + str(e))

          # 确保每类有内容
          all_items = translated_items[:]
          for cat in categories:
              if not categories[cat] and all_items:
                  categories[cat].append(all_items.pop(0))

          print('分类结果: 融资' + str(len(categories['融资速报'])) + '条, 大模型' + str(len(categories['行业动态-大模型'])) + '条, 硬件' + str(len(categories['行业动态-AI硬件/具身智能'])) + '条')

          # 构建最终输出
          final_results = []
          for cat_name in ['融资速报', '行业动态-大模型', '行业动态-AI硬件/具身智能']:
              for item in categories[cat_name]:
                  final_results.append(item)
          for i, item in enumerate(final_results, 1):
              item['index'] = i

          # 构建飞书卡片和推送（精简版）
          def build_feishu_card():
              elements = [{'tag': 'div', 'text': {'tag': 'lark_md', 'content': '**🤖 AI业界动态早报**\n**machinariumAIsupport | 每日早8点自动推送**\n📅 ' + date_str}}, {'tag': 'hr'}]
              
              for cat_key, cat_label, emoji in [('融资速报', '💰 融资速报', '💰'), ('行业动态-大模型', '🧠 行业动态-大模型', '🧠'), ('行业动态-AI硬件/具身智能', '🤖 行业动态-AI硬件/具身智能', '🤖')]:
                  if categories[cat_key]:
                      elements.append({'tag': 'div', 'text': {'tag': 'lark_md', 'content': '**' + cat_label + '**'}})
                      for item in categories[cat_key]:
                          elements.append({'tag': 'div', 'text': {'tag': 'lark_md', 'content': '**' + str(item['index']) + '.** [' + item['title'] + '](' + item['link'] + ')\n' + item['snippet']}})
                      elements.append({'tag': 'hr'})
              
              elements.append({'tag': 'div', 'text': {'tag': 'lark_md', 'content': '          ©️ machinariumAIsupport'}})
              
              return {'msg_type': 'interactive', 'card': {'config': {'wide_screen_mode': True}, 'header': {'title': {'tag': 'plain_text', 'content': 'AI业界动态早报 | ' + date_str}, 'template': 'purple'}, 'elements': elements}}

          # 推送飞书
          try:
              payload = build_feishu_card()
              r1 = requests.post(FEISHU_WEBHOOK_1, json=payload, headers={'Content-Type': 'application/json'})
              print('Feishu1: ' + str(r1.status_code))
              r2 = requests.post(FEISHU_WEBHOOK_2, json=payload, headers={'Content-Type': 'application/json'})
              print('Feishu2: ' + str(r2.status_code))
          except Exception as e:
              print('Feishu推送失败: ' + str(e))

          # 保存文件
          try:
              import os
              import glob
              os.makedirs('docs', exist_ok=True)
              
              news_standard = {'date': date_str, 'header': {'title': '🤖 AI业界动态早报', 'subtitle': 'machinariumAIsupport | 每日早8点自动推送'}, 'news': final_results}
              news_grouped = {'date': date_str, 'header': {'title': '🤖 AI业界动态早报', 'subtitle': 'machinariumAIsupport | 每日早8点自动推送'}, 'categories': [{'name': '融资速报', 'items': [{'title': i['title'], 'link': i['link'], 'snippet': i['snippet'], 'index': i['index']} for i in categories['融资速报']]}, {'name': '行业动态-大模型', 'items': [{'title': i['title'], 'link': i['link'], 'snippet': i['snippet'], 'index': i['index']} for i in categories['行业动态-大模型']]}, {'name': '行业动态-AI硬件/具身智能', 'items': [{'title': i['title'], 'link': i['link'], 'snippet': i['snippet'], 'index': i['index']} for i in categories['行业动态-AI硬件/具身智能']]}]}
              
              with open('docs/raw.json', 'w', encoding='utf-8') as f:
                  json.dump({'date': date_str, 'count': len(raw_items), 'items': raw_items}, f, ensure_ascii=False, indent=2)
              with open('docs/' + date_str + '.json', 'w', encoding='utf-8') as f:
                  json.dump(news_standard, f, ensure_ascii=False, indent=2)
              with open('docs/' + date_str + '_grouped.json', 'w', encoding='utf-8') as f:
                  json.dump(news_grouped, f, ensure_ascii=False, indent=2)
              with open('docs/latest.json', 'w', encoding='utf-8') as f:
                  json.dump(news_standard, f, ensure_ascii=False, indent=2)
              
              history = sorted([os.path.basename(f).replace('.json', '').replace('_grouped', '') for f in glob.glob('docs/2*.json') if not f.endswith('_grouped.json')], reverse=True)
              with open('docs/index.json', 'w', encoding='utf-8') as f:
                  json.dump({'latest': date_str, 'history': history[:30]}, f, ensure_ascii=False, indent=2)
              
              print('文件保存成功')
          except Exception as e:
              print('保存失败: ' + str(e))
              raise
          EOF
      
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add docs/ && git diff --staged --quiet || git commit -m "Update $(date +%Y-%m-%d) [skip ci]"
          git push
