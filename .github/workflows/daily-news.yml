name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '30 23 * * *'  # UTC 23:30 = 北京时间 07:30（次日）
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK_1: ${{ secrets.FEISHU_NEWS_LLM }}
          FEISHU_WEBHOOK_2: ${{ secrets.FEISHU_NEWS_LLM_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests
          import json
          from datetime import datetime, timedelta

          FEISHU_WEBHOOK_1 = os.environ['FEISHU_WEBHOOK_1']
          FEISHU_WEBHOOK_2 = os.environ['FEISHU_WEBHOOK_2']
          SERVERCHAN_KEY = os.environ['SERVERCHAN_KEY']
          SERPER_API_KEY = os.environ['SERPER_API_KEY']

          # 获取今天日期（北京时间）
          date_str = (datetime.now() + timedelta(hours=8)).strftime('%Y-%m-%d')

          headers_serper = {'X-API-KEY': SERPER_API_KEY, 'Content-Type': 'application/json'}
          
          # 境外域名排除列表
          foreign_domains = ['youtube.com', 'reddit.com', 'twitter.com', 'x.com', 
                            'medium.com', 'github.com', 'arxiv.org', 'huggingface.co',
                            'openai.com', 'anthropic.com', 'claude.ai']
          
          all_results = []
          seen_links = set()  # 简单去重

          def search_serper(query, max_results=10):
              """执行Serper搜索，返回结果列表"""
              try:
                  response = requests.post(
                      'https://google.serper.dev/search',
                      headers=headers_serper,
                      json={
                          'q': query,
                          'num': max_results,
                          'hl': 'zh-cn',
                          'gl': 'cn',
                          'tbs': 'qdr:d'
                      },
                      timeout=15
                  )
                  data = response.json()
                  
                  results = []
                  if 'organic' in data:
                      for item in data['organic']:
                          link = item['link']
                          # 去重检查
                          if link not in seen_links:
                              seen_links.add(link)
                              # 过滤境外域名
                              if not any(domain in link.lower() for domain in foreign_domains):
                                  results.append({
                                      'title': item['title'],
                                      'link': link,
                                      'snippet': item.get('snippet', '')[:60] + '...'
                                  })
                  return results
              except Exception as e:
                  print(f"Search error: {e}")
                  return []

          def score_hunter_value(item):
              """计算猎头价值分"""
              title = item['title'].lower()
              score = 0
              
              # P0: 高管流动
              if any(word in title for word in ['离职', '入职', '加盟', '任命', '跳槽', '创业', '加入']):
                  if any(word in title for word in ['cto', 'ceo', '总裁', 'vp', '总监', '负责人', '高管', '创始人', '合伙人', '科学家']):
                      score += 100
              
              # P1: 融资并购
              if any(word in title for word in ['融资', '并购', '收购', '合并', '估值', '轮次', '领投', '跟投']):
                  score += 80
              
              # P2: 上市/IPO
              if any(word in title for word in ['上市', 'ipo', '挂牌', '独角兽']):
                  score += 70
              
              # P3: 重大产品发布
              if any(word in title for word in ['发布', '推出', '开源']) and \
                 any(word in title for word in ['模型', '大模型', 'gpt', 'claude', 'gemini', '产品', '平台']):
                  score += 60
              
              # P4: 战略组织调整
              if any(word in title for word in ['战略', '组织架构', '调整', '重组', '裁员', '扩招', '撤销', '并入']):
                  score += 50
              
              return score

          # ========== 第1次搜索：新策略（精准公式） ==========
          print("=== 第1次搜索：精准公式 ===")
          
          LAYER_1 = "(离职 OR 加盟 OR 创业 OR 融资 OR 并购 OR 上市 OR 发布 OR 负责人 OR 创始人)"
          LAYER_2 = "(AI OR 人工智能 OR 大模型 OR 字节 OR 阿里 OR 腾讯 OR OpenAI OR 智谱 OR MiniMax OR 月之暗面 OR Kimi OR 阶跃 OR 商汤 OR 讯飞)"
          priority_query = f"{LAYER_1} AND {LAYER_2}"
          
          priority_results = search_serper(priority_query, max_results=10)
          print(f"精准公式结果: {len(priority_results)} 条")
          
          # 打分
          for item in priority_results:
              item['score'] = score_hunter_value(item)
              item['source'] = 'priority'
          
          all_results.extend(priority_results)

          # ========== 第2次搜索：原版保底（如果<10条） ==========
          if len(all_results) < 10:
              print(f"=== 第2次搜索：原版保底（还需 {10 - len(all_results)} 条） ===")
              
              fallback_queries = [
                  "LLM大模型 最新发布",
                  "AI人工智能 行业动态",
                  "ChatGPT Claude 更新",
                  "OpenAI Anthropic 新闻",
                  "大模型 融资 发布"
              ]
              
              remaining = 10 - len(all_results)
              for query in fallback_queries:
                  if len(all_results) >= 10:
                      break
                  results = search_serper(query, max_results=3)
                  for item in results:
                      item['score'] = score_hunter_value(item)
                      item['source'] = 'fallback'
                  all_results.extend(results)
                  print(f"  {query}: {len(results)} 条")

          # 排序取前10
          all_results.sort(key=lambda x: x['score'], reverse=True)
          final_results = all_results[:10]

          print(f"\n最终结果: {len(final_results)} 条")
          print(f"来源分布: priority={sum(1 for r in final_results if r['source']=='priority')}, fallback={sum(1 for r in final_results if r['source']=='fallback')}")

          # 重新编号
          for i, item in enumerate(final_results, 1):
              item['index'] = i

          # 构建新闻数据（格式完全不变）
          news_data = {
              "date": date_str,
              "header": {
                  "title": "🤖 AI业界动态早报",
                  "subtitle": "machinariumAIsupport | 每日早8点自动推送"
              },
              "news": final_results
          }

          # 构建飞书卡片（原版逻辑）
          def build_feishu_card():
              elements = []
              elements.append({
                  "tag": "div",
                  "text": {
                      "tag": "lark_md",
                      "content": f"**🤖 AI业界动态早报**\n**machinariumAIsupport | 每日早8点自动推送**\n📅 {date_str}"
                  }
              })
              elements.append({"tag": "hr"})

              for i, item in enumerate(final_results, 1):
                  elements.append({
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": f"**{i}.** [{item['title']}]({item['link']})\n{item['snippet']}"
                      }
                  })
                  elements.append({"tag": "hr"})
              
              elements.append({
                  "tag": "div",
                  "text": {
                      "tag": "lark_md",
                      "content": "          ©️ machinariumAIsupport"
                  }
              })

              return {
                  "msg_type": "interactive",
                  "card": {
                      "config": {"wide_screen_mode": True},
                      "header": {
                          "title": {"tag": "plain_text", "content": f"AI业界动态早报 | {date_str}"},
                          "template": "purple"
                      },
                      "elements": elements
                  }
              }

          # 发送到飞书群1
          try:
              payload = build_feishu_card()
              resp = requests.post(FEISHU_WEBHOOK_1, json=payload, headers={"Content-Type": "application/json"})
              print(f"Feishu 1 sent: {resp.status_code}")
          except Exception as e:
              print(f"Feishu 1 failed: {e}")

          # 发送到飞书群2
          try:
              payload = build_feishu_card()
              resp = requests.post(FEISHU_WEBHOOK_2, json=payload, headers={"Content-Type": "application/json"})
              print(f"Feishu 2 sent: {resp.status_code}")
          except Exception as e:
              print(f"Feishu 2 failed: {e}")

          # 发送到Server酱
          try:
              lines = [f"🤖 AI业界动态早报", f"machinariumAIsupport | 每日早8点自动推送", f"📅 {date_str}", "=" * 40, ""]
              for i, item in enumerate(final_results, 1):
                  lines.append(f"{i}. {item['title']}")
                  lines.append(f"   {item['snippet']}")
                  lines.append(f"   {item['link']}")
                  lines.append("")
              lines.append("=" * 40)
              lines.append("©️ machinariumAIsupport")
              
              text = "\n".join(lines)
              resp = requests.post(
                  f"https://sctapi.ftqq.com/{SERVERCHAN_KEY}.send",
                  data={"title": f"AI业界动态早报 | {date_str}", "desp": text}
              )
              print(f"ServerChan sent: {resp.status_code}")
          except Exception as e:
              print(f"ServerChan failed: {e}")

          # 保存到 docs 目录（原版逻辑）
          try:
              import os
              import glob
              
              os.makedirs('docs', exist_ok=True)
              
              # 1. 保存当天日期文件
              daily_file = f'docs/{date_str}.json'
              with open(daily_file, 'w', encoding='utf-8') as f:
                  json.dump(news_data, f, ensure_ascii=False, indent=2)
              print(f"Saved to {daily_file}")
              
              # 2. 更新 latest.json
              with open('docs/latest.json', 'w', encoding='utf-8') as f:
                  json.dump(news_data, f, ensure_ascii=False, indent=2)
              print("Updated docs/latest.json")
              
              # 3. 生成索引文件
              history_files = glob.glob('docs/2*.json')
              dates = sorted([os.path.basename(f).replace('.json', '') for f in history_files], reverse=True)
              
              index_data = {
                  "latest": date_str,
                  "history": dates[:30]
              }
              with open('docs/index.json', 'w', encoding='utf-8') as f:
                  json.dump(index_data, f, ensure_ascii=False, indent=2)
              print("Updated docs/index.json")
              
          except Exception as e:
              print(f"Save to file failed: {e}")
              raise
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add docs/
          git diff --staged --quiet || git commit -m "Update daily news for $(date +%Y-%m-%d) [skip ci]"
          git push
