name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '30 23 * * *'  # 北京时间 07:30
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK_1: ${{ secrets.FEISHU_NEWS_LLM }}
          FEISHU_WEBHOOK_2: ${{ secrets.FEISHU_NEWS_LLM_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests
          import json
          from datetime import datetime, timedelta

          FEISHU_WEBHOOK_1 = os.environ['FEISHU_WEBHOOK_1']
          FEISHU_WEBHOOK_2 = os.environ['FEISHU_WEBHOOK_2']
          SERVERCHAN_KEY = os.environ['SERVERCHAN_KEY']
          SERPER_API_KEY = os.environ['SERPER_API_KEY']

          # 获取今天日期
          date_str = (datetime.now() + timedelta(hours=8)).strftime('%Y-%m-%d')

          headers_serper = {'X-API-KEY': SERPER_API_KEY, 'Content-Type': 'application/json'}
          
          # 用于去重
          seen_links = set()
          all_results = []

          def search_news(queries, source_filter=None, max_per_query=4):
              """执行搜索，返回结果列表"""
              results = []
              for query in queries:
                  try:
                      search_params = {
                          'q': query,
                          'num': 10,
                          'hl': 'zh-cn',
                          'gl': 'cn',
                          'tbs': 'qdr:d'
                      }
                      
                      response = requests.post(
                          'https://google.serper.dev/search',
                          headers=headers_serper,
                          json=search_params
                      )
                      data = response.json()
                      
                      if 'organic' in data:
                          for item in data['organic'][:max_per_query]:
                              link = item['link']
                              # 去重检查
                              if link not in seen_links:
                                  seen_links.add(link)
                                  results.append({
                                      'title': item['title'],
                                      'link': link,
                                      'snippet': item.get('snippet', '')[:60] + '...'
                                  })
                  except Exception as e:
                      print(f"Search failed for {query}: {e}")
              return results

          # ========== 第一次搜索：猎头聚焦 ==========
          print("=== 第一次搜索：猎头聚焦 ===")
          
          # 高管流动关键词
          executive_queries = [
              "AI 人工智能 高管 离职 入职 任命 VP 总监 CTO CEO 总裁 site:36kr.com OR site:huxiu.com OR site:jiqizhixin.com",
              "大模型 人才 流动 跳槽 挖角 团队 组织架构调整 site:36kr.com OR site:huxiu.com OR site:jiqizhixin.com",
              "AI 融资 并购 收购 轮次 估值 投资方 领投 site:36kr.com OR site:huxiu.com OR site:jiqizhixin.com"
          ]
          
          priority_results = search_news(executive_queries, max_per_query=5)
          print(f"猎头聚焦结果: {len(priority_results)} 条")
          
          all_results.extend(priority_results)

          # ========== 第二次搜索：兜底补充（如果不足10条） ==========
          if len(all_results) < 10:
              print(f"=== 第二次搜索：兜底补充（还需 {10 - len(all_results)} 条） ===")
              
              fallback_queries = [
                  "LLM大模型 最新发布",
                  "AI人工智能 行业动态",
                  "ChatGPT Claude 更新",
                  "OpenAI Anthropic 新闻",
                  "大模型 融资 发布"
              ]
              
              # 计算还需多少条
              remaining_slots = 10 - len(all_results)
              max_per_query = max(2, remaining_slots // len(fallback_queries) + 1)
              
              fallback_results = search_news(fallback_queries, max_per_query=max_per_query)
              print(f"兜底补充结果: {len(fallback_results)} 条")
              
              all_results.extend(fallback_results)

          # 截取前10条
          final_results = all_results[:10]
          print(f"最终结果: {len(final_results)} 条")

          # 过滤国外域名
          foreign_domains = ['youtube.com', 'reddit.com', 'twitter.com', 'x.com', 
                            'medium.com', 'github.com', 'arxiv.org', 'huggingface.co',
                            'openai.com', 'anthropic.com', 'claude.ai']
          
          filtered_results = []
          for item in final_results:
              link = item['link'].lower()
              if not any(domain in link for domain in foreign_domains):
                  filtered_results.append(item)

          # 如果过滤后不足10条，不再补充（保持简单）
          filtered_results = filtered_results[:10]

          # 重新编号
          for i, item in enumerate(filtered_results, 1):
              item['index'] = i

          # 构建新闻数据（格式完全不变）
          news_data = {
              "date": date_str,
              "header": {
                  "title": "🤖 AI业界动态早报",
                  "subtitle": "machinariumAIsupport | 每日早8点自动推送"
              },
              "news": filtered_results
          }

          # 构建飞书卡片
          def build_feishu_card():
              elements = []
              elements.append({
                  "tag": "div",
                  "text": {
                      "tag": "lark_md",
                      "content": f"**🤖 AI业界动态早报**\n**machinariumAIsupport | 每日早8点自动推送**\n📅 {date_str}"
                  }
              })
              elements.append({"tag": "hr"})

              for i, item in enumerate(filtered_results, 1):
                  elements.append({
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": f"**{i}.** [{item['title']}]({item['link']})\n{item['snippet']}"
                      }
                  })
                  elements.append({"tag": "hr"})
              
              elements.append({
                  "tag": "div",
                  "text": {
                      "tag": "lark_md",
                      "content": "          ©️ machinariumAIsupport"
                  }
              })

              return {
                  "msg_type": "interactive",
                  "card": {
                      "config": {"wide_screen_mode": True},
                      "header": {
                          "title": {"tag": "plain_text", "content": f"AI业界动态早报 | {date_str}"},
                          "template": "purple"
                      },
                      "elements": elements
                  }
              }

          # 发送到飞书群1
          try:
              payload = build_feishu_card()
              resp = requests.post(FEISHU_WEBHOOK_1, json=payload, headers={"Content-Type": "application/json"})
              print(f"Feishu 1 sent: {resp.status_code}")
          except Exception as e:
              print(f"Feishu 1 failed: {e}")

          # 发送到飞书群2
          try:
              payload = build_feishu_card()
              resp = requests.post(FEISHU_WEBHOOK_2, json=payload, headers={"Content-Type": "application/json"})
              print(f"Feishu 2 sent: {resp.status_code}")
          except Exception as e:
              print(f"Feishu 2 failed: {e}")

          # 发送到Server酱
          try:
              lines = [f"🤖 AI业界动态早报", f"machinariumAIsupport | 每日早8点自动推送", f"📅 {date_str}", "=" * 40, ""]
              for i, item in enumerate(filtered_results, 1):
                  lines.append(f"{i}. {item['title']}")
                  lines.append(f"   {item['snippet']}")
                  lines.append(f"   {item['link']}")
                  lines.append("")
              lines.append("=" * 40)
              lines.append("©️ machinariumAIsupport")
              
              text = "\n".join(lines)
              resp = requests.post(
                  f"https://sctapi.ftqq.com/{SERVERCHAN_KEY}.send",
                  data={"title": f"AI业界动态早报 | {date_str}", "desp": text}
              )
              print(f"ServerChan sent: {resp.status_code}")
          except Exception as e:
              print(f"ServerChan failed: {e}")

          # 保存到 docs 目录
          try:
              import os
              
              os.makedirs('docs', exist_ok=True)
              
              # 1. 保存当天日期文件
              daily_file = f'docs/{date_str}.json'
              with open(daily_file, 'w', encoding='utf-8') as f:
                  json.dump(news_data, f, ensure_ascii=False, indent=2)
              print(f"Saved to {daily_file}")
              
              # 2. 更新 latest.json
              with open('docs/latest.json', 'w', encoding='utf-8') as f:
                  json.dump(news_data, f, ensure_ascii=False, indent=2)
              print("Updated docs/latest.json")
              
              # 3. 生成索引文件
              import glob
              history_files = glob.glob('docs/2*.json')
              dates = sorted([os.path.basename(f).replace('.json', '') for f in history_files], reverse=True)
              
              index_data = {
                  "latest": date_str,
                  "history": dates[:30]
              }
              with open('docs/index.json', 'w', encoding='utf-8') as f:
                  json.dump(index_data, f, ensure_ascii=False, indent=2)
              print("Updated docs/index.json")
              
          except Exception as e:
              print(f"Save to file failed: {e}")
              raise
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add docs/
          git diff --staged --quiet || git commit -m "Update daily news for $(date +%Y-%m-%d) [skip ci]"
          git push
