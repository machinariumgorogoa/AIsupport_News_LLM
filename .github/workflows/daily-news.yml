name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_NEWS_LLM }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests
          import json
          from datetime import datetime

          FEISHU_WEBHOOK = os.environ['FEISHU_WEBHOOK']
          SERPER_API_KEY = os.environ['SERPER_API_KEY']

          # 简单节假日判断（2026年）
          holidays = ['2026-01-01', '2026-01-02', '2026-01-03',  # 元旦
                      '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20', '2026-02-21', '2026-02-22', '2026-02-23',  # 春节
                      '2026-04-04', '2026-04-05', '2026-04-06',  # 清明
                      '2026-05-01', '2026-05-02', '2026-05-03',  # 五一
                      '2026-06-19', '2026-06-20', '2026-06-21',  # 端午
                      '2026-09-25', '2026-09-26', '2026-09-27',  # 中秋
                      '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05', '2026-10-06', '2026-10-07', '2026-10-08']  # 国庆

          today = datetime.now().strftime('%Y-%m-%d')
          if today in holidays:
              print(f"Today {today} is holiday, skip")
              exit(0)

          search_queries = [
              "LLM大模型 最新发布",
              "AI人工智能 行业动态",
              "ChatGPT Claude 更新",
              "OpenAI Anthropic 新闻",
              "大模型 融资 发布"
          ]

          all_results = []
          headers = {'X-API-KEY': SERPER_API_KEY, 'Content-Type': 'application/json'}

          for query in search_queries:
              try:
                  response = requests.post(
                      'https://google.serper.dev/search',
                      headers=headers,
                      json={
                          'q': query, 
                          'num': 10,
                          'hl': 'zh-cn', 
                          'gl': 'cn',
                          'tbs': 'qdr:d'
                      }
                  )
                  data = response.json()
                  if 'organic' in data:
                      for item in data['organic'][:4]:
                          all_results.append({
                              'title': item['title'],
                              'link': item['link'],
                              'snippet': item.get('snippet', '')[:60] + '...'
                          })
              except Exception as e:
                  print(f"Search failed for {query}: {e}")

          foreign_domains = ['youtube.com', 'reddit.com', 'twitter.com', 'x.com', 
                            'medium.com', 'github.com', 'arxiv.org', 'huggingface.co',
                            'openai.com', 'anthropic.com', 'claude.ai']
          
          filtered_results = []
          for item in all_results:
              link = item['link'].lower()
              if not any(domain in link for domain in foreign_domains):
                  filtered_results.append(item)

          date_str = datetime.now().strftime("%Y-%m-%d")
          
          elements = []
          
          elements.append({
              "tag": "div",
              "text": {
                  "tag": "lark_md",
                  "content": f"**🤖 AI业界动态早报**\n**machinariumAIsupport | 每日早8点自动推送**\n📅 {date_str}"
              }
          })
          
          elements.append({"tag": "hr"})

          for i, item in enumerate(filtered_results[:10], 1):
              elements.append({
                  "tag": "div",
                  "text": {
                      "tag": "lark_md",
                      "content": f"**{i}.** [{item['title']}]({item['link']})\n{item['snippet']}"
                  }
              })
              elements.append({"tag": "hr"})
          
          # 底部版权（居中模拟）
          elements.append({
              "tag": "div",
              "text": {
                  "tag": "lark_md",
                  "content": "          ©️ machinariumAIsupport"
              }
          })

          payload = {
              "msg_type": "interactive",
              "card": {
                  "config": {
                      "wide_screen_mode": True
                  },
                  "header": {
                      "title": {
                          "tag": "plain_text",
                          "content": f"AI业界动态早报 | {date_str}"
                      },
                      "template": "purple"
                  },
                  "elements": elements
              }
          }

          resp = requests.post(
              FEISHU_WEBHOOK,
              json=payload,
              headers={"Content-Type": "application/json"}
          )

          print(f"Status: {resp.status_code}")
          if resp.status_code != 200:
              raise Exception(f"Failed: {resp.text}")
          EOF
