name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '30 23 * * *'  # UTC 23:30 = 北京时间 07:30（次日）
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK_1: ${{ secrets.FEISHU_NEWS_LLM }}
          FEISHU_WEBHOOK_2: ${{ secrets.FEISHU_NEWS_LLM_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests
          import json
          import re
          from datetime import datetime, timedelta

          FEISHU_WEBHOOK_1 = os.environ['FEISHU_WEBHOOK_1']
          FEISHU_WEBHOOK_2 = os.environ['FEISHU_WEBHOOK_2']
          SERVERCHAN_KEY = os.environ['SERVERCHAN_KEY']
          TAVILY_API_KEY = os.environ['TAVILY_API_KEY']
          KIMI_API_KEY = os.environ['KIMI_API_KEY']

          date_str = (datetime.now() + timedelta(hours=8)).strftime('%Y-%m-%d')

          def call_kimi(prompt, max_tokens=1000):
              try:
                  response = requests.post(
                      'https://api.moonshot.cn/v1/chat/completions',
                      headers={
                          'Authorization': f'Bearer {KIMI_API_KEY}',
                          'Content-Type': 'application/json'
                      },
                      json={
                          'model': 'kimi-k2.5',
                          'messages': [{'role': 'user', 'content': prompt}],
                          'temperature': 1,
                          'max_tokens': max_tokens
                      },
                      timeout=300
                  )
                  result = response.json()
                  return result['choices'][0]['message']['content'].strip()
              except Exception as e:
                  print(f"Kimi API error: {e}")
                  return None

          # 外网及低质量域名过滤
          foreign_domains = ['youtube.com', 'reddit.com', 'twitter.com', 'x.com', 
                            'medium.com', 'github.com', 'arxiv.org', 'huggingface.co',
                            'openai.com', 'anthropic.com', 'claude.ai', 'facebook.com',
                            'apple.com', 'podcasts.apple.com']
          
          seen_links = set()

          def search_tavily(query, max_results=20):
              try:
                  response = requests.post(
                      'https://api.tavily.com/search',
                      json={
                          'api_key': TAVILY_API_KEY,
                          'query': query,
                          'max_results': max_results,
                          'time_range': 'day',
                          'search_depth': 'basic',
                          'include_domains': [],
                          'exclude_domains': foreign_domains
                      },
                      timeout=150
                  )
                  data = response.json()
                  
                  results = []
                  if 'results' in data:
                      for item in data['results']:
                          link = item['url']
                          if link not in seen_links:
                              seen_links.add(link)
                              # Tavily返回content较长，截取作为snippet
                              content = item.get('content', '')
                              snippet = content[:80] + '...' if len(content) > 80 else content
                              results.append({
                                  'title': item['title'],
                                  'link': link,
                                  'snippet': snippet,
                                  'raw_snippet': content
                              })
                  return results
              except Exception as e:
                  print(f"Search error: {e}")
                  return []

          def score_hunter_value(item):
              title = item['title'].lower()
              score = 0
              
              if any(word in title for word in ['融资', '并购', '收购', '合并', '估值', '轮次', '领投', '跟投']):
                  score += 100
              if any(word in title for word in ['离职', '入职', '加盟', '任命', '跳槽', '创业', '加入', 'cto', 'ceo', '总裁', 'vp', '总监', '负责人', '高管', '创始人', '合伙人', '科学家']):
                  score += 90
              if any(word in title for word in ['上市', 'ipo', '挂牌', '独角兽']):
                  score += 80
              if any(word in title for word in ['发布', '推出', '开源']) and \
                 any(word in title for word in ['模型', '大模型', 'gpt', 'claude', 'gemini', '产品', '平台']):
                  score += 60
              if any(word in title for word in ['芯片', '机器人', 'Figure', '具身', '传感器', '算力', '硬件']):
                  score += 50
              
              return score

          print("=== 搜索阶段 ===")
          
          LAYER_1 = "(离职 OR 加盟 OR 创业 OR 融资 OR 并购 OR 上市 OR 发布 OR 负责人 OR 创始人)"
          LAYER_2 = "(AI OR 人工智能 OR 大模型 OR 字节 OR 阿里 OR 腾讯 OR OpenAI OR 智谱 OR MiniMax OR 月之暗面 OR Kimi OR 阶跃 OR 商汤 OR 讯飞 OR 具身智能 OR 机器人)"
          priority_query = f"{LAYER_1} AND {LAYER_2}"
          
          priority_results = search_tavily(priority_query, max_results=20)
          print(f"Tavily返回: {len(priority_results)} 条")

          raw_data = {
              "date": date_str,
              "count": len(priority_results),
              "items": priority_results
          }

          for item in priority_results:
              item['score'] = score_hunter_value(item)

          print("=== LLM 语义去重 ===")
          
          def dedup_by_llm(items, target_count=10):
              if len(items) <= 1:
                  return items
              
              titles_text = "\n".join([f"{i+1}. {item['title']}\n   摘要：{item['raw_snippet'][:50]}" for i, item in enumerate(items)])
              
              with open('prompts/dedup.txt', 'r', encoding='utf-8') as f:
                  prompt_template = f.read()
              
              prompt = prompt_template.format(count=len(items), titles=titles_text, target=target_count)
              
              result = call_kimi(prompt, max_tokens=20000)
              if result:
                  try:
                      numbers = re.findall(r'\d+', result)
                      indices = [int(n) - 1 for n in numbers if 1 <= int(n) <= len(items)]
                      if len(indices) >= target_count * 0.5:
                          return [items[i] for i in indices[:target_count]]
                  except Exception as e:
                      print(f"Parse error: {e}, fallback to score ranking")
              
              items.sort(key=lambda x: x['score'], reverse=True)
              return items[:target_count]

          deduped_results = dedup_by_llm(priority_results, target_count=10)
          print(f"去重后: {len(deduped_results)} 条")

          print("=== LLM 智能分类 ===")
          
          def classify_by_llm(items):
              if not items:
                  return {"融资速报": [], "行业动态-大模型": [], "行业动态-AI硬件/具身智能": []}
              
              titles_text = "\n".join([f"{i+1}. {item['title']}" for i, item in enumerate(items)])
              
              with open('prompts/classify.txt', 'r', encoding='utf-8') as f:
                  prompt_template = f.read()
              
              prompt = prompt_template.format(titles=titles_text)
              
              result = call_kimi(prompt, max_tokens=50000)
              categories = {"融资速报": [], "行业动态-大模型": [], "行业动态-AI硬件/具身智能": []}
              
              if result:
                  try:
                      json_match = re.search(r'\{.*\}', result, re.DOTALL)
                      if json_match:
                          parsed = json.loads(json_match.group())
                          for cat, indices in parsed.items():
                              if cat in categories:
                                  valid_indices = [i-1 for i in indices if isinstance(i, int) and 1 <= i <= len(items)]
                                  categories[cat] = [items[i] for i in valid_indices]
                  except Exception as e:
                      print(f"Classification parse error: {e}")
                      for item in items:
                          title_lower = item['title'].lower()
                          if any(w in title_lower for w in ['融资', '并购', '估值', '上市', 'ipo', '轮', '领投', '跟投']):
                              categories["融资速报"].append(item)
                          elif any(w in title_lower for w in ['芯片', '机器人', '具身', '传感器', '硬件', 'figure', '特斯拉']):
                              categories["行业动态-AI硬件/具身智能"].append(item)
                          else:
                              categories["行业动态-大模型"].append(item)
              else:
                  for item in items:
                      title_lower = item['title'].lower()
                      if any(w in title_lower for w in ['融资', '并购', '估值', '上市', 'ipo', '轮', '领投', '跟投']):
                          categories["融资速报"].append(item)
                      elif any(w in title_lower for w in ['芯片', '机器人', '具身', '传感器', '硬件', 'figure', '特斯拉']):
                          categories["行业动态-AI硬件/具身智能"].append(item)
                      else:
                          categories["行业动态-大模型"].append(item)
              
              all_items = items[:]
              for cat in categories:
                  if not categories[cat] and all_items:
                      categories[cat].append(all_items.pop(0))
              
              return categories

          classified = classify_by_llm(deduped_results)
          print(f"分类结果: 融资{len(classified['融资速报'])}条, 大模型{len(classified['行业动态-大模型'])}条, 硬件{len(classified['行业动态-AI硬件/具身智能'])}条")

          final_results = []
          for cat_name in ["融资速报", "行业动态-大模型", "行业动态-AI硬件/具身智能"]:
              for item in classified[cat_name]:
                  final_results.append(item)
          
          for i, item in enumerate(final_results, 1):
              item['index'] = i

          news_data_standard = {
              "date": date_str,
              "header": {
                  "title": "🤖 AI业界动态早报",
                  "subtitle": "machinariumAIsupport | 每日早8点自动推送"
              },
              "news": final_results
          }

          news_data_grouped = {
              "date": date_str,
              "header": {
                  "title": "🤖 AI业界动态早报",
                  "subtitle": "machinariumAIsupport | 每日早8点自动推送"
              },
              "categories": [
                  {
                      "name": "融资速报",
                      "items": [{"title": item['title'], "link": item['link'], "snippet": item['snippet'], "index": item['index']} for item in classified["融资速报"]]
                  },
                  {
                      "name": "行业动态-大模型",
                      "items": [{"title": item['title'], "link": item['link'], "snippet": item['snippet'], "index": item['index']} for item in classified["行业动态-大模型"]]
                  },
                  {
                      "name": "行业动态-AI硬件/具身智能",
                      "items": [{"title": item['title'], "link": item['link'], "snippet": item['snippet'], "index": item['index']} for item in classified["行业动态-AI硬件/具身智能"]]
                  }
              ]
          }

          def build_feishu_card_grouped():
              elements = []
              elements.append({
                  "tag": "div",
                  "text": {
                      "tag": "lark_md",
                      "content": f"**🤖 AI业界动态早报**\n**machinariumAIsupport | 每日早8点自动推送**\n📅 {date_str}"
                  }
              })
              elements.append({"tag": "hr"})

              if classified["融资速报"]:
                  elements.append({
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": "**💰 融资速报**"
                      }
                  })
                  for item in classified["融资速报"]:
                      elements.append({
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": f"**{item['index']}.** [{item['title']}]({item['link']})\n{item['snippet']}"
                          }
                      })
                  elements.append({"tag": "hr"})

              if classified["行业动态-大模型"]:
                  elements.append({
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": "**🧠 行业动态-大模型**"
                      }
                  })
                  for item in classified["行业动态-大模型"]:
                      elements.append({
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": f"**{item['index']}.** [{item['title']}]({item['link']})\n{item['snippet']}"
                          }
                      })
                  elements.append({"tag": "hr"})

              if classified["行业动态-AI硬件/具身智能"]:
                  elements.append({
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": "**🤖 行业动态-AI硬件/具身智能**"
                      }
                  })
                  for item in classified["行业动态-AI硬件/具身智能"]:
                      elements.append({
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": f"**{item['index']}.** [{item['title']}]({item['link']})\n{item['snippet']}"
                          }
                      })
                  elements.append({"tag": "hr"})

              elements.append({
                  "tag": "div",
                  "text": {
                      "tag": "lark_md",
                      "content": "          ©️ machinariumAIsupport"
                  }
              })

              return {
                  "msg_type": "interactive",
                  "card": {
                      "config": {"wide_screen_mode": True},
                      "header": {
                          "title": {"tag": "plain_text", "content": f"AI业界动态早报 | {date_str}"},
                          "template": "purple"
                      },
                      "elements": elements
                  }
              }

          try:
              payload = build_feishu_card_grouped()
              resp = requests.post(FEISHU_WEBHOOK_1, json=payload, headers={"Content-Type": "application/json"})
              print(f"Feishu 1 sent: {resp.status_code}")
          except Exception as e:
              print(f"Feishu 1 failed: {e}")

          try:
              payload = build_feishu_card_grouped()
              resp = requests.post(FEISHU_WEBHOOK_2, json=payload, headers={"Content-Type": "application/json"})
              print(f"Feishu 2 sent: {resp.status_code}")
          except Exception as e:
              print(f"Feishu 2 failed: {e}")

          try:
              lines = [f"🤖 AI业界动态早报", f"machinariumAIsupport | 每日早8点自动推送", f"📅 {date_str}", "=" * 40, ""]
              
              if classified["融资速报"]:
                  lines.append("💰 融资速报")
                  for item in classified["融资速报"]:
                      lines.append(f"{item['index']}. {item['title']}")
                      lines.append(f"   {item['link']}")
                  lines.append("")
              
              if classified["行业动态-大模型"]:
                  lines.append("🧠 行业动态-大模型")
                  for item in classified["行业动态-大模型"]:
                      lines.append(f"{item['index']}. {item['title']}")
                      lines.append(f"   {item['link']}")
                  lines.append("")
              
              if classified["行业动态-AI硬件/具身智能"]:
                  lines.append("🤖 行业动态-AI硬件/具身智能")
                  for item in classified["行业动态-AI硬件/具身智能"]:
                      lines.append(f"{item['index']}. {item['title']}")
                      lines.append(f"   {item['link']}")
                  lines.append("")

              lines.append("=" * 40)
              lines.append("©️ machinariumAIsupport")
              
              text = "\n".join(lines)
              resp = requests.post(
                  f"https://sctapi.ftqq.com/{SERVERCHAN_KEY}.send",
                  data={"title": f"AI业界动态早报 | {date_str}", "desp": text}
              )
              print(f"ServerChan sent: {resp.status_code}")
          except Exception as e:
              print(f"ServerChan failed: {e}")

          try:
              import os
              import glob
              
              os.makedirs('docs', exist_ok=True)
              
              with open('docs/raw.json', 'w', encoding='utf-8') as f:
                  json.dump(raw_data, f, ensure_ascii=False, indent=2)
              print("Saved docs/raw.json")
              
              daily_file = f'docs/{date_str}.json'
              with open(daily_file, 'w', encoding='utf-8') as f:
                  json.dump(news_data_standard, f, ensure_ascii=False, indent=2)
              print(f"Saved {daily_file}")
              
              grouped_file = f'docs/{date_str}_grouped.json'
              with open(grouped_file, 'w', encoding='utf-8') as f:
                  json.dump(news_data_grouped, f, ensure_ascii=False, indent=2)
              print(f"Saved {grouped_file}")
              
              with open('docs/latest.json', 'w', encoding='utf-8') as f:
                  json.dump(news_data_standard, f, ensure_ascii=False, indent=2)
              print("Updated docs/latest.json")
              
              history_files = glob.glob('docs/2*.json')
              dates = sorted([os.path.basename(f).replace('.json', '').replace('_grouped', '') for f in history_files if not f.endswith('_grouped.json')], reverse=True)
              
              index_data = {
                  "latest": date_str,
                  "history": dates[:30]
              }
              with open('docs/index.json', 'w', encoding='utf-8') as f:
                  json.dump(index_data, f, ensure_ascii=False, indent=2)
              print("Updated docs/index.json")
              
          except Exception as e:
              print(f"Save to file failed: {e}")
              raise
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add docs/
          git diff --staged --quiet || git commit -m "Update daily news for $(date +%Y-%m-%d) with Tavily source [skip ci]"
          git push
