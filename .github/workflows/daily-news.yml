name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_NEWS_LLM }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests
          import json
          from datetime import datetime

          FEISHU_WEBHOOK = os.environ['FEISHU_WEBHOOK']
          SERPER_API_KEY = os.environ['SERPER_API_KEY']

          search_queries = [
              "LLM大模型 最新发布 2025",
              "AI人工智能 行业动态 2025",
              "ChatGPT Claude 更新 2025"
          ]

          all_results = []
          headers = {'X-API-KEY': SERPER_API_KEY, 'Content-Type': 'application/json'}

          for query in search_queries:
              try:
                  response = requests.post(
                      'https://google.serper.dev/search',
                      headers=headers,
                      json={'q': query, 'num': 3, 'hl': 'zh-cn', 'gl': 'cn'}
                  )
                  data = response.json()
                  if 'organic' in data:
                      for item in data['organic'][:2]:
                          all_results.append({
                              'title': item['title'],
                              'link': item['link'],
                              'snippet': item.get('snippet', '')[:100] + '...'
                          })
              except Exception as e:
                  print(f"Search failed for {query}: {e}")

          date_str = datetime.now().strftime("%Y-%m-%d")
          lines = [f"🤖 LLM行业早报 ({date_str})", ""]

          for i, item in enumerate(all_results[:5], 1):
              lines.append(f"{i}. {item['title']}")
              lines.append(f"   {item['snippet']}")
              lines.append(f"   {item['link']}")
              lines.append("")

          content = "\n".join(lines)

          payload = {
              "msg_type": "text",
              "content": {"text": content}
          }

          resp = requests.post(
              FEISHU_WEBHOOK,
              json=payload,
              headers={"Content-Type": "application/json"}
          )

          print(f"Status: {resp.status_code}")
          if resp.status_code != 200:
              raise Exception(f"Failed: {resp.text}")
          EOF
