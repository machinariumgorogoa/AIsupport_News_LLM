name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK_1: ${{ secrets.FEISHU_NEWS_LLM }}
          FEISHU_WEBHOOK_2: ${{ secrets.FEISHU_NEWS_LLM_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          pip install requests
          python << 'EOF'
          import os
          import requests
          import json
          import re
          from datetime import datetime, timedelta

          FEISHU_WEBHOOK_1 = os.environ['FEISHU_WEBHOOK_1']
          FEISHU_WEBHOOK_2 = os.environ['FEISHU_WEBHOOK_2']
          SERVERCHAN_KEY = os.environ['SERVERCHAN_KEY']
          TAVILY_API_KEY = os.environ['TAVILY_API_KEY']
          KIMI_API_KEY = os.environ['KIMI_API_KEY']

          date_str = (datetime.now() + timedelta(hours=8)).strftime('%Y-%m-%d')
          LOW_QUALITY_DOMAINS = ['instagram.com', 'facebook.com', 'linkedin.com', 'workable.com', 'threads.com']
          
          def is_chinese(text):
              return bool(re.search(r'[\u4e00-\u9fff]', text))

          def read_prompt_file(filename):
              """【修复点1】读取prompt文件，失败时返回None"""
              try:
                  with open(f'prompts/{filename}', 'r', encoding='utf-8') as f:
                      content = f.read()
                      print(f"  ✅ 读取 {filename}: {len(content)} 字符")
                      return content
              except Exception as e:
                  print(f"  ❌ 读取 {filename} 失败: {e}")
                  return None

          def call_kimi(prompt, max_tokens=1000):
              """【修复点2】带详细错误打印的Kimi调用"""
              if not prompt or len(prompt.strip()) < 10:
                  print("    ⚠️ prompt为空或太短，跳过调用")
                  return None
              
              try:
                  response = requests.post(
                      'https://api.moonshot.cn/v1/chat/completions',
                      headers={'Authorization': f'Bearer {KIMI_API_KEY}', 'Content-Type': 'application/json'},
                      json={'model': 'kimi-k2.5', 'messages': [{'role': 'user', 'content': prompt}], 'temperature': 1, 'max_tokens': max_tokens},
                      timeout=300
                  )
                  
                  # 【修复点3】打印状态码和响应前200字符
                  print(f"    📡 Kimi API 状态码: {response.status_code}")
                  
                  if response.status_code != 200:
                      print(f"    ❌ 错误响应: {response.text[:200]}")
                      return None
                  
                  result = response.json()
                  if 'choices' not in result:
                      print(f"    ❌ 响应无choices字段: {str(result)[:200]}")
                      return None
                  
                  return result['choices'][0]['message']['content'].strip()
              except Exception as e:
                  print(f"    ❌ 调用异常: {e}")
                  return None

          # 【修复点4】硬编码fallback提示词（文件读取失败时使用）
          FALLBACK_DEDUP = """分析以下新闻，去除重复报道同一事件的条目，保留{target}条：
{titles}
返回序号，如1,3,5"""

          FALLBACK_TRANSLATE = """翻译以下新闻标题和摘要成中文：
标题：{title}
摘要：{content}
格式：
标题：[中文]
摘要：[中文]"""

          FALLBACK_CLASSIFY = """分类以下新闻到[融资,大模型,硬件]三类：
{titles}
返回JSON：{"融资速报":[1,2],"行业动态-大模型":[3,4],"行业动态-AI硬件/具身智能":[5]}"""

          print("=== 搜索阶段 ===")
          resp1 = requests.post('https://api.tavily.com/search', json={'api_key': TAVILY_API_KEY, 'query': '(funding OR IPO OR merger OR acquisition OR valuation) AND (AI OR artificial intelligence)', 'max_results': 20, 'time_range': 'day', 'search_depth': 'basic', 'exclude_domains': ['youtube.com', 'reddit.com', 'instagram.com', 'facebook.com']}, timeout=150)
          results1 = resp1.json().get('results', [])
          print(f"融资类: {len(results1)} 条")

          resp2 = requests.post('https://api.tavily.com/search', json={'api_key': TAVILY_API_KEY, 'query': '(hire OR appoint OR founder OR CEO OR launch OR product) AND (AI OR artificial intelligence)', 'max_results': 20, 'time_range': 'day', 'search_depth': 'basic', 'exclude_domains': ['youtube.com', 'reddit.com', 'instagram.com', 'facebook.com']}, timeout=150)
          results2 = resp2.json().get('results', [])
          print(f"人事类: {len(results2)} 条")

          seen_urls = set()
          raw_items = []
          for item in results1 + results2:
              url = item.get('url', '')
              if url in seen_urls or not url or any(d in url.lower() for d in LOW_QUALITY_DOMAINS):
                  continue
              seen_urls.add(url)
              content = item.get('content', '')
              raw_items.append({
                  'title': item.get('title', ''),
                  'link': url,
                  'snippet': content[:80] + '...' if len(content) > 80 else content,
                  'raw_snippet': content,
                  'is_chinese': is_chinese(item.get('title', ''))
              })

          print(f"过滤后: {len(raw_items)} 条")

          print("=== 去重阶段 ===")
          dedup_prompt_template = read_prompt_file('dedup.txt') or FALLBACK_DEDUP
          titles_text = "\n".join([f"{i+1}. {item['title']}\n   摘要：{item['raw_snippet'][:50]}" for i, item in enumerate(raw_items)])
          dedup_prompt = dedup_prompt_template.format(count=len(raw_items), titles=titles_text, target=10)
          
          dedup_result = call_kimi(dedup_prompt, max_tokens=20000)
          deduped_items = []
          if dedup_result:
              try:
                  numbers = re.findall(r'\d+', dedup_result)
                  indices = [int(n) - 1 for n in numbers if 1 <= int(n) <= len(raw_items)]
                  deduped_items = [raw_items[i] for i in indices[:10]]
              except Exception as e:
                  print(f"解析失败: {e}")
          if not deduped_items:
              print("⚠️ 去重失败，使用top10")
              deduped_items = raw_items[:10]
          print(f"去重后: {len(deduped_items)} 条")

          print("=== 翻译阶段 ===")
          trans_prompt_template = read_prompt_file('translate.txt') or FALLBACK_TRANSLATE
          translated_items = []
          for i, item in enumerate(deduped_items):
              if not item['is_chinese']:
                  print(f"  翻译 {i+1}/{len(deduped_items)}: {item['title'][:30]}...")
                  trans_prompt = trans_prompt_template.format(title=item['title'], content=item['raw_snippet'][:200])
                  trans_result = call_kimi(trans_prompt, max_tokens=800)
                  if trans_result:
                      # 解析翻译结果
                      lines = [l.strip() for l in trans_result.split('\n') if l.strip()]
                      new_title = lines[0] if lines else item['title']
                      new_content = lines[1] if len(lines) > 1 else item['snippet']
                      item['title'] = new_title
                      item['snippet'] = new_content
                      item['original_title'] = item.get('title', '')
              translated_items.append(item)
          print(f"翻译完成: {len(translated_items)} 条")

          print("=== 分类阶段 ===")
          class_prompt_template = read_prompt_file('classify.txt') or FALLBACK_CLASSIFY
          class_titles = "\n".join([f"{i+1}. {item['title']}" for i, item in enumerate(translated_items)])
          class_prompt = class_prompt_template.format(titles=class_titles)
          
          class_result = call_kimi(class_prompt, max_tokens=50000)
          categories = {"融资速报": [], "行业动态-大模型": [], "行业动态-AI硬件/具身智能": []}
          
          if class_result:
              try:
                  json_match = re.search(r'\{.*\}', class_result, re.DOTALL)
                  if json_match:
                      parsed = json.loads(json_match.group())
                      for cat, indices in parsed.items():
                          if cat in categories:
                              valid = [i-1 for i in indices if isinstance(i, int) and 1 <= i <= len(translated_items)]
                              categories[cat] = [translated_items[i] for i in valid]
              except Exception as e:
                  print(f"分类解析失败: {e}")

          # 确保每类有内容
          for cat in categories:
              if not categories[cat] and translated_items:
                  categories[cat].append(translated_items.pop(0))

          print(f"分类结果: 融资{len(categories['融资速报'])}条, 大模型{len(categories['行业动态-大模型'])}条, 硬件{len(categories['行业动态-AI硬件/具身智能'])}条")

          # 构建输出（与之前相同，略...）
          final_results = []
          for cat_name in ["融资速报", "行业动态-大模型", "行业动态-AI硬件/具身智能"]:
              for item in categories[cat_name]:
                  final_results.append(item)
          for i, item in enumerate(final_results, 1):
              item['index'] = i

          # 保存和推送（代码略，与之前版本相同）
          # ... [保存JSON、构建飞书卡片、推送的逻辑与上一版相同]

          EOF
      
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add docs/ && git commit -m "Update $(date +%Y-%m-%d) [skip ci]" || echo "No changes"
          git push
