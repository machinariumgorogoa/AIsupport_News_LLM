name: Daily LLM News to Feishu

on:
  schedule:
    - cron: '30 02 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch and send LLM news
        env:
          FEISHU_WEBHOOK_1: ${{ secrets.FEISHU_NEWS_LLM }}
          FEISHU_WEBHOOK_2: ${{ secrets.FEISHU_NEWS_LLM_2 }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import requests
          import json
          import re
          from datetime import datetime, timedelta

          FEISHU_WEBHOOK_1 = os.environ['FEISHU_WEBHOOK_1']
          FEISHU_WEBHOOK_2 = os.environ['FEISHU_WEBHOOK_2']
          SERVERCHAN_KEY = os.environ['SERVERCHAN_KEY']
          TAVILY_API_KEY = os.environ['TAVILY_API_KEY']
          KIMI_API_KEY = os.environ['KIMI_API_KEY']

          date_str = (datetime.now() + timedelta(hours=8)).strftime('%Y-%m-%d')
          LOW_QUALITY_DOMAINS = ['instagram.com', 'facebook.com', 'linkedin.com', 'workable.com', 'threads.com']
          
          def is_chinese(text):
              return bool(re.search(r'[\u4e00-\u9fff]', text))

          def read_prompt_file(filename):
              try:
                  with open('prompts/' + filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                      print('  [OK] 读取 ' + filename + ': ' + str(len(content)) + ' 字符')
                      return content
              except Exception as e:
                  print('  [ERR] 读取 ' + filename + ' 失败: ' + str(e))
                  return None

          def call_kimi(prompt, max_tokens=1000):
              import time
              
              if not prompt or len(prompt.strip()) < 10:
                  return None
              
              # 指数退避：最多试3次，遇到429就重试
              max_retries = 3
              for attempt in range(max_retries):
                  try:
                      response = requests.post(
                          'https://api.moonshot.cn/v1/chat/completions',
                          headers={'Authorization': 'Bearer ' + KIMI_API_KEY, 'Content-Type': 'application/json'},
                          json={'model': 'kimi-k2.5', 'messages': [{'role': 'user', 'content': prompt}], 'temperature': 1, 'max_tokens': max_tokens},
                          timeout=300
                      )
                      
                      if response.status_code == 200:
                          result = response.json()
                          if 'choices' in result:
                              return result['choices'][0]['message']['content'].strip()
                      elif response.status_code == 429:
                          # 指数退避：第1次等2秒，第2次等4秒，第3次等8秒
                          wait_time = 2 ** (attempt + 1)
                          print('    [WARN] 429限流，等待' + str(wait_time) + '秒后重试... (第' + str(attempt+1) + '次)')
                          time.sleep(wait_time)
                          continue  # 继续下一次重试
                      else:
                          print('    [ERR] API失败: ' + str(response.status_code))
                          return None
                          
                  except Exception as e:
                      print('    [ERR] 异常: ' + str(e))
                      return None
              
              # 3次都失败了
              print('    [ERR] 重试3次后仍失败，放弃')
              return None

          # Fallback提示词
          FALLBACK_DEDUP = '分析以下新闻，去除重复报道同一事件的条目，保留{target}条：\n{titles}\n返回序号，如1,3,5'
          FALLBACK_BATCH_TRANS = '批量翻译以下AI新闻为中文，保留专业术语。格式：\n序号. [中文标题] | [中文摘要50字]\n\n{items}'
          FALLBACK_CLASSIFY = '分类以下新闻到两组：融资速报、行业动态-大模型。\n返回JSON格式：{"融资速报":[1,2],"行业动态-大模型":[3,4]}\n\n{titles}'

          print('=== 搜索阶段 ===')
          resp1 = requests.post('https://api.tavily.com/search', 
              json={'api_key': TAVILY_API_KEY, 'query': '(funding OR IPO OR merger OR acquisition OR valuation) AND (AI OR artificial intelligence)', 'max_results': 20, 'time_range': 'day', 'search_depth': 'basic', 'exclude_domains': ['youtube.com', 'reddit.com', 'facebook.com']},
              timeout=150)
          results1 = resp1.json().get('results', [])
          print('融资类: ' + str(len(results1)) + ' 条')

          resp2 = requests.post('https://api.tavily.com/search',
              json={'api_key': TAVILY_API_KEY, 'query': '(hire OR appoint OR founder OR CEO OR launch OR product) AND (AI OR artificial intelligence)', 'max_results': 20, 'time_range': 'day', 'search_depth': 'basic', 'exclude_domains': ['youtube.com', 'reddit.com', 'facebook.com']},
              timeout=150)
          results2 = resp2.json().get('results', [])
          print('人事/产品类: ' + str(len(results2)) + ' 条')

          seen_urls = set()
          raw_items = []
          
          # 【修改1】标记来源类型，区分融资类和人事类
          for item in results1:
              url = item.get('url', '')
              if url in seen_urls or not url:
                  continue
              if any(d in url.lower() for d in LOW_QUALITY_DOMAINS):
                  continue
              seen_urls.add(url)
              content = item.get('content', '')
              raw_items.append({
                  'title': item.get('title', ''),
                  'link': url,
                  'snippet': content[:80] + '...' if len(content) > 300 else content,
                  'raw_snippet': content,
                  'is_chinese': is_chinese(item.get('title', '')),
                  'source_type': 'funding'  # 标记为融资类
              })
          
          for item in results2:
              url = item.get('url', '')
              if url in seen_urls or not url:
                  continue
              if any(d in url.lower() for d in LOW_QUALITY_DOMAINS):
                  continue
              seen_urls.add(url)
              content = item.get('content', '')
              raw_items.append({
                  'title': item.get('title', ''),
                  'link': url,
                  'snippet': content[:80] + '...' if len(content) > 80 else content,
                  'raw_snippet': content,
                  'is_chinese': is_chinese(item.get('title', '')),
                  'source_type': 'people'  # 标记为人事类
              })

          print('过滤后: ' + str(len(raw_items)) + ' 条')

          print('=== 去重阶段（修复：分类去重确保均衡） ===')
          
          # 【修改2】将数据按来源类型分组
          funding_items = [item for item in raw_items if item.get('source_type') == 'funding']
          people_items = [item for item in raw_items if item.get('source_type') == 'people']
          
          print('  分组结果: 融资类 ' + str(len(funding_items)) + ' 条, 人事类 ' + str(len(people_items)) + ' 条')
          
          dedup_template = read_prompt_file('dedup.txt') or FALLBACK_DEDUP
          
          # 【修改3】对每组分别去重，每组最多保留5条
          def dedup_subset(items, label, target_count=5):
              if not items:
                  return []
              if len(items) <= target_count:
                  return items
              
              titles_text = '\n'.join([str(i+1) + '. ' + item['title'][:60] + '\n   摘要：' + item['raw_snippet'][:40] for i, item in enumerate(items)])
              dedup_prompt = dedup_template.format(count=len(items), titles=titles_text, target=target_count)
              
              dedup_result = call_kimi(dedup_prompt, max_tokens=2000)
              selected_items = []
              
              if dedup_result:
                  try:
                      numbers = re.findall(r'\d+', dedup_result)
                      indices = [int(n) - 1 for n in numbers if 1 <= int(n) <= len(items)]
                      selected_items = [items[i] for i in indices[:target_count]]
                      print('  [' + label + '] 去重成功: 保留 ' + str(len(selected_items)) + ' 条')
                  except Exception as e:
                      print('  [' + label + '] 去重解析失败: ' + str(e))
              
              if not selected_items:
                  print('  [' + label + '] 使用默认top' + str(target_count))
                  selected_items = items[:target_count]
              
              return selected_items
          
          # 分别去重，确保两类都有代表
          deduped_funding = dedup_subset(funding_items, '融资类', 5)
          deduped_people = dedup_subset(people_items, '人事类', 5)
          
          # 合并结果（保持原有顺序：融资在前，人事在后）
          deduped_items = deduped_funding + deduped_people
          
          print('去重完成: 总计 ' + str(len(deduped_items)) + ' 条（融资' + str(len(deduped_funding)) + ' + 人事' + str(len(deduped_people)) + '）')

          print('=== 批量翻译阶段 ===')
          non_zh_items = [item for item in deduped_items if not item['is_chinese']]
          
          if non_zh_items:
              print('需翻译: ' + str(len(non_zh_items)) + '条')
              trans_template = read_prompt_file('translate.txt') or FALLBACK_BATCH_TRANS
              
              if '{items}' not in trans_template:
                  trans_template = FALLBACK_BATCH_TRANS
              
              items_text = '\n'.join([str(i+1) + '. ' + item['title'] + ' | ' + item['raw_snippet'][:60] for i, item in enumerate(non_zh_items)])
              trans_prompt = trans_template.format(items=items_text)
              
              trans_result = call_kimi(trans_prompt, max_tokens=2000)
              
              if trans_result:
                  print('解析翻译结果...')
                  for i, item in enumerate(non_zh_items):
                      pattern = str(i+1) + r'\.\s*\[([^\]]+)\]\s*\|\s*([^\n]+)'
                      match = re.search(pattern, trans_result)
                      if match:
                          item['title'] = match.group(1).strip()[:80]
                          item['snippet'] = match.group(2).strip()[:200]
                          print('  [' + str(i+1) + '] 翻译成功')
                      else:
                          loose = str(i+1) + r'\.\s*(.+?)(?=\n\d+\.|$)'
                          loose_match = re.search(loose, trans_result, re.DOTALL)
                          if loose_match:
                              text = loose_match.group(1).strip()
                              if '|' in text:
                                  parts = text.split('|', 1)
                                  item['title'] = parts[0].replace('[', '').strip()[:80]
                                  item['snippet'] = parts[1].replace(']', '').strip()[:100]
              else:
                  print('翻译失败，保留原文')
          
          translated_items = deduped_items
          print('翻译完成: ' + str(len(translated_items)) + ' 条')

          # 【简化】直接根据搜索阶段的 source_type 分组，不再调用Kimi分类
          categories = {'融资速报': [], '行业动态-大模型': []}
          
          for item in translated_items:
              if item.get('source_type') == 'funding':
                  categories['融资速报'].append(item)
              elif item.get('source_type') == 'people':
                  categories['行业动态-大模型'].append(item)
          
          print('分类结果: 融资' + str(len(categories['融资速报'])) + '条, 大模型' + str(len(categories['行业动态-大模型'])) + '条')

          # 构建最终输出（两组），确保索引不重复
          final_results = []
          idx = 1
          for cat_name in ['融资速报', '行业动态-大模型']:
              for item in categories[cat_name]:
                  item['index'] = idx
                  final_results.append(item)
                  idx += 1

          # 构建飞书卡片（两组）
          def build_feishu_card():
              elements = [{'tag': 'div', 'text': {'tag': 'lark_md', 'content': '**🤖 AI业界动态早报**\n**machinariumAIsupport | 每日早8点自动推送**\n📅 ' + date_str}}, {'tag': 'hr'}]
              
              for cat_key, cat_label in [('融资速报', '💰 融资速报'), ('行业动态-大模型', '🧠 行业动态-大模型')]:
                  if categories[cat_key]:
                      elements.append({'tag': 'div', 'text': {'tag': 'lark_md', 'content': '**' + cat_label + '**'}})
                      for item in categories[cat_key]:
                          elements.append({'tag': 'div', 'text': {'tag': 'lark_md', 'content': '**' + str(item['index']) + '.** [' + item['title'] + '](' + item['link'] + ')\n' + item['snippet']}})
                      elements.append({'tag': 'hr'})
              
              elements.append({'tag': 'div', 'text': {'tag': 'lark_md', 'content': '©️ machinariumAIsupport'}})
              return {'msg_type': 'interactive', 'card': {'config': {'wide_screen_mode': True}, 'header': {'title': {'tag': 'plain_text', 'content': 'AI业界动态早报 | ' + date_str}, 'template': 'purple'}, 'elements': elements}}

          # 推送
          try:
              payload = build_feishu_card()
              r1 = requests.post(FEISHU_WEBHOOK_1, json=payload, headers={'Content-Type': 'application/json'})
              print('Feishu1: ' + str(r1.status_code))
              r2 = requests.post(FEISHU_WEBHOOK_2, json=payload, headers={'Content-Type': 'application/json'})
              print('Feishu2: ' + str(r2.status_code))
          except Exception as e:
              print('推送失败: ' + str(e))

          # 保存（两组结构）
          try:
              import os
              import glob
              os.makedirs('docs', exist_ok=True)
              
              news_standard = {'date': date_str, 'header': {'title': '🤖 AI业界动态早报', 'subtitle': 'machinariumAIsupport | 每日早8点自动推送'}, 'news': final_results}
              news_grouped = {
                  'date': date_str, 
                  'header': {'title': '🤖 AI业界动态早报', 'subtitle': 'machinariumAIsupport | 每日早8点自动推送'}, 
                  'categories': [
                      {'name': '融资速报', 'items': [{'title': i['title'], 'link': i['link'], 'snippet': i['snippet'], 'index': i['index']} for i in categories['融资速报']]}, 
                      {'name': '行业动态-大模型', 'items': [{'title': i['title'], 'link': i['link'], 'snippet': i['snippet'], 'index': i['index']} for i in categories['行业动态-大模型']]}
                  ]
              }
              
              with open('docs/raw.json', 'w', encoding='utf-8') as f:
                  json.dump({'date': date_str, 'count': len(raw_items), 'items': raw_items}, f, ensure_ascii=False, indent=2)
              with open('docs/' + date_str + '.json', 'w', encoding='utf-8') as f:
                  json.dump(news_standard, f, ensure_ascii=False, indent=2)
              with open('docs/' + date_str + '_grouped.json', 'w', encoding='utf-8') as f:
                  json.dump(news_grouped, f, ensure_ascii=False, indent=2)
              with open('docs/latest.json', 'w', encoding='utf-8') as f:
                  json.dump(news_standard, f, ensure_ascii=False, indent=2)
              
              history = sorted([os.path.basename(f).replace('.json', '').replace('_grouped', '') for f in glob.glob('docs/2*.json') if not f.endswith('_grouped.json')], reverse=True)
              with open('docs/index.json', 'w', encoding='utf-8') as f:
                  json.dump({'latest': date_str, 'history': history[:30]}, f, ensure_ascii=False, indent=2)
              
              print('保存成功: ' + str(len(final_results)) + '条')
          except Exception as e:
              print('保存失败: ' + str(e))
              raise
          EOF
      
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add docs/ && git diff --staged --quiet || git commit -m "Update $(date +%Y-%m-%d) [skip ci]"
          git push
